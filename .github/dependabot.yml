# 依存脆弱性監視と更新方針: docs/security/dependency-monitoring.md（R15）。
version: 2
updates:
  - package-ecosystem: npm
    # pnpm workspace の全メンバー(ルート・apps/*・packages/*)を監視する。個々の package.json は
    # "catalog:" で pnpm-workspace.yaml を参照するだけなので、各ディレクトリを明示して漏れを防ぐ
    # (e2e/ は package.json を持たず、唯一の依存 @playwright/test はルートの catalog 参照のため
    # ルートの監視だけで足りる。directory と directories は同じ更新設定内で併用できないため、
    # 単一ディレクトリだった directory: / を directories の1項目として書き直した)。
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
    schedule:
      interval: daily
      time: '07:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      compatible-tooling:
        dependency-type: development
        patterns: ['*']
        update-types: [minor, patch]
        exclude-patterns: ['electron', '@playwright/test', 'opencascade.js', 'fflate', 'opentype.js']
    commit-message:
      prefix: '依存更新'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'CI依存更新'
