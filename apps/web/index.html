<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PointerCAD</title>
    <style data-startup-style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body { background: #16181d; }
      [data-startup-shell] {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 2rem;
        overflow: auto;
        font: 14px/1.6 "Segoe UI", "Yu Gothic UI", system-ui, sans-serif;
        color: #e7eaf1;
        background: radial-gradient(ellipse at 50% 38%, #202b40 0, #16181d 64%);
        opacity: 1;
        transition: opacity 180ms ease-out;
      }
      [data-startup-shell][data-state="leaving"] { opacity: 0; pointer-events: none; }
      .pcad-startup__content { width: min(100%, 28rem); text-align: center; }
      .pcad-startup__mark {
        display: block;
        width: 64px;
        height: 64px;
        padding: 18px;
        margin: 0 auto 22px;
        color: #79a9ff;
        background: #4f8cff0d;
        border: 1px solid #4f8cff33;
        border-radius: 24px;
        box-shadow: 0 0 72px #4f8cff12;
      }
      .pcad-startup__content h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: .025em; }
      [data-startup-loading] { margin: 12px 0 22px; color: #aebace; }
      .pcad-startup__track { width: 160px; height: 2px; margin: 0 auto 30px; overflow: hidden; background: #34415b; }
      .pcad-startup__track::after {
        content: "";
        display: block;
        width: 60%;
        height: 100%;
        background: #79a9ff;
        animation: pcad-startup-progress 2.2s ease-in-out infinite;
      }
      /* Keep the reserved space steady; reveal help without depending on JavaScript. */
      .pcad-startup__recovery {
        margin: 0 auto;
        max-width: 26rem;
        color: #9ca8bd;
        font-size: 12px;
        visibility: hidden;
        animation: pcad-startup-recovery 0s 8s forwards;
      }
      [data-startup-shell][data-state="failed"] .pcad-startup__recovery { animation: none; visibility: visible; }
      @keyframes pcad-startup-recovery { to { visibility: visible; } }
      .pcad-startup__recovery p { margin: 0 0 12px; }
      [data-startup-shell] a { color: #9bbfff; text-underline-offset: 4px; }
      [data-startup-shell] a:focus-visible { outline: 2px solid #9bbfff; outline-offset: 6px; border-radius: 2px; }
      [data-startup-failure] { color: #ffb5ae; }
      [data-startup-shell][data-state="failed"] .pcad-startup__track { visibility: hidden; }
      @keyframes pcad-startup-progress { 0%, 100% { transform: translateX(-100%); } 50% { transform: translateX(165%); } }
      @media (prefers-reduced-motion: reduce) {
        [data-startup-shell] { transition: none; }
        .pcad-startup__track::after { animation: none; width: 100%; }
        /* Recovery uses only a delayed visibility switch, with no motion or fading. */
      }
    </style>
  </head>
  <body>
    <main data-startup-shell aria-labelledby="pcad-startup-title">
      <div class="pcad-startup__content">
        <svg class="pcad-startup__mark" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 1.75 14 5.25v5.5L8 14.25 2 10.75v-5.5z" />
          <path d="M2 5.25 8 8.75l6-3.5M8 8.75v5.5" />
        </svg>
        <h1 id="pcad-startup-title">PointerCAD</h1>
        <p data-startup-loading role="status">{{startup:loading}}</p>
        <div class="pcad-startup__track" aria-hidden="true"></div>
        <p data-startup-failure hidden>{{startup:failed}}</p>
        <div class="pcad-startup__recovery">
          <p>{{startup:hint}}</p>
          <a href="">{{startup:retry}}</a>
        </div>
      </div>
    </main>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
