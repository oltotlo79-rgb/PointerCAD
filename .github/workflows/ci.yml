# PointerCAD CI: 手元・gitフックと同じ scripts/check.ps1 を実行する(検査の単一正本)。
# 検査コマンドをこのファイルへ直接書かない(rules/03-品質ゲート.md §7.2)。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: リポジトリの取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js の準備
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: pnpm の準備 (corepack)
        if: ${{ hashFiles('package.json') != '' }}
        shell: pwsh
        env:
          # 非対話環境で corepack がダウンロード確認を待って止まるのを防ぐ。
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable

      - name: 一括検査 (scripts/check.ps1)
        shell: pwsh
        run: ./scripts/check.ps1 -Install

      - name: 失敗した実画面検査の記録を保存
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failure-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
