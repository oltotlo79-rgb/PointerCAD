packages:
  - "packages/*"
  - "apps/*"

# 依存のバージョンはここに1箇所だけ書く。各 package.json は "catalog:" と書いて参照する。
# 範囲指定(^ / ~)を使わず完全固定する(docs/requirements.md §6.1)。
catalog:
  "@cortex-js/compute-engine": 0.128.6
  "@eslint/js": 10.0.1
  "@playwright/test": 1.62.1
  "@types/node": 22.20.1
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5
  "@types/three": 0.185.4
  "@vitejs/plugin-react": 6.1.1
  comlink: 4.4.2
  decimal.js: 10.6.0
  electron: 44.1.0
  electron-builder: 26.15.3
  eslint: 10.9.1
  eslint-plugin-react-hooks: 7.1.1
  fflate: 0.8.3
  globals: 17.11.0
  mathlive: 0.110.0
  opencascade.js: 2.0.0-beta.5780049
  opentype.js: 2.0.0
  quickjs-wasi: 3.6.0
  react: 19.2.8
  react-dom: 19.2.8
  three: 0.185.1
  typescript: 5.9.3
  typescript-eslint: 8.69.0
  vite: 8.2.2
  vitest: 4.1.11
  zustand: 5.0.15

minimumReleaseAgeStrict: true

# pnpm 11ではallowBuildsで導入時の処理を明示する。旧onlyBuiltDependenciesは廃止済み。
# ただし electron 44 は package.json に postinstall を持たず、バイナリは
# 初回の `electron .` 実行時か `install-electron` コマンドで取得される(タスク16 実測)。
# そのためこの許可は electron に対しては現状働かない。将来 postinstall が復活した場合と、
# 他の依存が増えた場合に備えて残す。
allowBuilds:
  electron: true
  # 採用したNSIS形式ではSquirrel用の7z配置処理を使わない。
  electron-winstaller: false
