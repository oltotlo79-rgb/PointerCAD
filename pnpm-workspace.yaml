packages:
  - "packages/*"
  - "apps/*"

# 依存のバージョンはここに1箇所だけ書く。各 package.json は "catalog:" と書いて参照する。
# 範囲指定(^ / ~)を使わず完全固定する(docs/requirements.md §6.1)。
catalog:
  "@eslint/js": 10.0.1
  "@playwright/test": 1.62.1
  "@types/node": 22.20.1
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5
  "@types/three": 0.185.4
  "@vitejs/plugin-react": 6.1.1
  comlink: 4.4.2
  electron: 44.1.1
  eslint: 10.9.1
  eslint-plugin-react-hooks: 7.1.1
  globals: 17.11.0
  opencascade.js: 2.0.0-beta.b5ff984
  react: 19.2.8
  react-dom: 19.2.8
  three: 0.185.1
  typescript: 5.9.3
  typescript-eslint: 8.69.0
  vite: 8.2.2
  vitest: 4.1.11
  zustand: 5.0.15

# Electron はインストール後スクリプトでバイナリを取得する。pnpm 10 以降は
# 既定でインストール後スクリプトを実行しないため、明示的に許可する。
onlyBuiltDependencies:
  - electron
