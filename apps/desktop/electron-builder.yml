# 配布作成だけに使用する。公開操作と自動更新は行わない。
appId: org.pointercad.desktop
productName: PointerCAD
executableName: PointerCAD
asar: false
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
forceCodeSigning: false
publish: null
compression: normal
files:
  - package.json
  - desktop-package.json
  - LICENSE
  - NOTICE
  - dist/**/*
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  signExecutable: false
  signAndEditExecutable: true
  # 製品の印(ツールバーの立方体)。16〜256pxを1つの.icoに収め、本体・導入・削除の画面で使う。
  icon: icon.ico
  artifactName: PointerCAD-${version}-windows-${arch}-setup.${ext}
nsis:
  include: installer.nsh
  oneClick: false
  perMachine: false
  selectPerMachineByDefault: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  runAfterFinish: false
  packElevateHelper: false
  useZip: true
  differentialPackage: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  installerLanguages: [ja_JP, en_US]
portable:
  # 26.15.3の共有書庫を使わず、portable.nsiのFile /rで同梱する。
  # nsisのZIPを7zとして扱う組合せを避ける（nsis.useZipは継承されない）。
  useZip: true
  artifactName: PointerCAD-${version}-windows-${arch}-portable.${ext}
  requestExecutionLevel: user
  # 固定版26.15.3ではtrueが$PLUGINSDIRを使う。同時起動で展開先を共有しない。
  unpackDirName: true
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Graphics
  icon: icon.png
  # 窓と.desktopの項目を結び付ける名前(app_id / WM_CLASS)。本体のpackage.jsonのdesktopNameと揃える。
  syncDesktopName: true
  # 26.15.3の${arch}はAppImageでx64をx86_64と書く(builder-utilのgetArtifactArchName)。
  # 配布の計画(desktopPackageTargets.mjs)の名前どおりx64を直接書く。
  artifactName: PointerCAD-${version}-linux-x64.${ext}
