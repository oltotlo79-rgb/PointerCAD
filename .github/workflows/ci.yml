# PointerCAD CI: 手元・gitフックと同じ scripts/check.ps1 を実行する(検査の単一正本)。
# 検査コマンドをこのファイルへ直接書かない(rules/03-品質ゲート.md §7.2)。
name: CI

# 2026-09-27 利用者の決定「CIに任せてよい」: 手元の検査は画面検査の全件を流さないため、
# 作業ブランチ(feature/**)へのpushでも両OSの全件を流す。手動の再実行は workflow_dispatch。
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小権限(NFR-SE-2)。GITHUB_TOKEN を使うのは actions/checkout(リポジトリの取得)だけで、
# コミット・PR・Issue・パッケージ公開など書き込みは一切行わない。
# 根拠: actions/checkout の README(https://github.com/actions/checkout#usage)が
# 「contents: read」を推奨。actions/upload-artifact・actions/download-artifact は同じrunの
# アーティファクトだけを扱い、GITHUB_TOKEN の権限を使わず別方式(アーティファクト用の一時トークン)で
# 認証するため対象外(https://github.com/actions/upload-artifact/issues/197、
# actions/download-artifact v4 の README)。actions/setup-node もキャッシュや公開設定を使っておらず、
# GITHUB_TOKEN を必要としない。secret を使う step は無い。
permissions:
  contents: read

# 2026-09-28(レビュー §6.3「検査の待ち時間を減らす」): 以前は両OS×3組の各組が型・lint・全単体・
# ビルドを繰り返してから画面検査の1/3を流していた(run 36346675432 で1組 84〜189分)。画面検査は webServer が
# 自分で組み立てるため前段の成果物を使わない。そこで OS ごとに、前段(自己試験・型・lint・単体の
# 残り・ビルド)と単体の先行分を1回ずつ、画面検査を6組(2026-11-12 に3組から変更)に分けて、8台で同時に流す。
# 検査の件数・OS・精度・時間の判定は変えない。各段は成功したときだけ「同じ版・lock・道具と通した手順」を記録し、
# 集約(checks)が両OSの全16段の記録を照合する(scripts/lib/ci_stage_evidence.py)。
# 各段でNode.jsの版がずれると集約の照合に失敗するため、同じ正確な版に固定する。
jobs:
  front:
    # 前段: 品質ゲートの自己試験・型・lint・単体の残り(ルートの test の後半)・両アプリの組み立て。
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # 止まった検査で6時間待たないための上限(実測の最大 約40分の2倍強。検査の時間判定ではない)。
    timeout-minutes: 90
    steps:
      - name: リポジトリの取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node.js の準備
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3

      - name: pnpm の準備 (corepack)
        if: ${{ hashFiles('package.json') != '' }}
        shell: pwsh
        env:
          # 非対話環境で corepack がダウンロード確認を待って止まるのを防ぐ。
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable

      - name: 前段の検査 (scripts/check.ps1)
        shell: pwsh
        run: ./scripts/check.ps1 -Install -CIStage Front -StageEvidence '${{ runner.temp }}/pointercad-ci-stage'

      - name: 前段の記録を渡す
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-stage-${{ matrix.os }}-front
          path: ${{ runner.temp }}/pointercad-ci-stage/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  unit-lead:
    # 単体の先行分(ルートの test の前半。前半と後半をつなぐと元の test と一致することを
    # check.ps1 と集約が確かめる)。実形状の数式計算を別の実行機で専有して流す。
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # 止まった検査で6時間待たないための上限(実測の最大 約24分の2倍強。検査の時間判定ではない)。
    timeout-minutes: 60
    steps:
      - name: リポジトリの取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node.js の準備
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3

      - name: pnpm の準備 (corepack)
        if: ${{ hashFiles('package.json') != '' }}
        shell: pwsh
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable

      - name: Set up Python for native FEM tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      # Native FEM unit tests invoke python with PYTHONNOUSERSITE=1; isolate their dependency.
      # 2.2.5 is the existing pinned FEM runtime NumPy source version.
      - name: Prepare Python for native FEM tests
        shell: pwsh
        run: |
          python -c "import sys; assert (3,10) <= sys.version_info[:2] <= (3,13), sys.version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $venv = Join-Path $env:RUNNER_TEMP pointercad-python
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = if ($IsWindows) { Join-Path $venv Scripts } else { Join-Path $venv bin }
          $python = Join-Path $bin python
          & $python -m pip install numpy==2.2.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -c "import numpy; assert numpy.__version__ == '2.2.5'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 単体の先行分 (scripts/check.ps1)
        shell: pwsh
        run: ./scripts/check.ps1 -Install -CIStage UnitLead -StageEvidence '${{ runner.temp }}/pointercad-ci-stage'

      - name: 単体の先行分の記録を渡す
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-stage-${{ matrix.os }}-unit-lead
          path: ${{ runner.temp }}/pointercad-ci-stage/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  e2e:
    # 画面検査を Playwright の同じ設定から6組へ分配する(性能・起動の前提 project は各組で重複して流す)。
    # 組の数は scripts/check.ps1 の $ciE2EShardTotal・scripts/lib/ci_stage_evidence.py の SHARD_TOTAL と
    # 同じにする(ci_stage_evidence.py の自己試験が、この matrix と下の '/6' を含む3か所の一致を確かめる)。
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ matrix.os }}
    # 止まった検査で6時間待たないための上限。検査の時間判定ではない。
    # Playwright 1.62.1 は試験を件数で等分し、project の順(functional→firefox→electron)に先頭から切る(所要時間は見ない)。
    # 3組の時の main の CI(run 43038990339)の Win は 47分・129分・138分(通信切れ)と偏った(firefox の重い数式系と electron の直列が後ろの組に集中)。
    # 6組の見込みは最も長い組で 60分(速い実行機)〜88分(遅い実行機)。160分は3組の時の上限のまま据え置く。
    timeout-minutes: 160
    steps:
      - name: リポジトリの取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node.js の準備
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3

      - name: pnpm の準備 (corepack)
        if: ${{ hashFiles('package.json') != '' }}
        shell: pwsh
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable

      - name: 画面検査の1組 (scripts/check.ps1)
        shell: pwsh
        run: ./scripts/check.ps1 -Install -CIStage E2E -E2EShard '${{ matrix.shard }}/6' -StageEvidence '${{ runner.temp }}/pointercad-ci-stage'

      - name: 画面検査の記録を渡す
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-stage-${{ matrix.os }}-e2e-${{ matrix.shard }}
          path: ${{ runner.temp }}/pointercad-ci-stage/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: 失敗した実画面検査の記録を保存
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-${{ matrix.os }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the existing required check names. One missing, cancelled or failed
  # stage must not turn either OS's overall check green.
  checks:
    # 前jobの結果と段の記録の照合だけ(GITHUB_TOKENはリポジトリの取得にだけ使う)。contents: readのみで足りる。
    permissions:
      contents: read
    if: always()
    needs: [front, unit-lead, e2e]
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: 両OSの全段の成功を確認
        shell: pwsh
        env:
          FRONT_RESULT: ${{ needs.front.result }}
          UNIT_LEAD_RESULT: ${{ needs.unit-lead.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          if ($env:FRONT_RESULT -ne 'success' -or $env:UNIT_LEAD_RESULT -ne 'success' -or $env:E2E_RESULT -ne 'success') { throw '両OSの前段・単体の先行分・画面検査の全6組が成功していません。' }
          Write-Host '[OK] 両OSの全段のjobが成功しました。段の記録を照合します。'

      - name: リポジトリの取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 両OSの段の記録を受け取る
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ci-stage-*
          merge-multiple: true
          path: ${{ runner.temp }}/pointercad-ci-stage

      - name: 両OSの全段の記録を照合 (scripts/check.ps1)
        shell: pwsh
        run: ./scripts/check.ps1 -CIStage Verify -StageEvidence '${{ runner.temp }}/pointercad-ci-stage'
